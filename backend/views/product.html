<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="IRON-PREP product details">
    <title>Product | IRON-PREP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav class="navbar sticky-top" data-bs-theme="dark">
        <div class="container py-2">
            <a class="navbar-brand" href="/">IRON<span>-PREP</span></a>
        </div>
    </nav>

    <main>
        <section class="section-space">
            <div class="container">
                <nav aria-label="Breadcrumb">
                    <ol class="breadcrumb" id="productBreadcrumb">
                        <li class="breadcrumb-item"><a href="/">Home</a></li>
                        <li class="breadcrumb-item"><a href="/products">Shop</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Loading</li>
                    </ol>
                </nav>

                <div id="productStatus" class="alert alert-secondary" role="status" aria-live="polite">Loading product...</div>
                <div id="productContent" class="row g-4 g-lg-5 d-none">
                    <div class="col-lg-6">
                        <img id="productImage" class="product-detail-image w-100" alt="" loading="lazy">
                    </div>
                    <div class="col-lg-6">
                        <span id="productCategory" class="badge badge-soft mb-3"></span>
                        <h1 id="productName" class="section-heading"></h1>
                        <p id="productPrice" class="price h3 text-accent"></p>
                        <p id="productDescription" class="muted"></p>

                        <div class="d-flex align-items-center gap-2 mb-3">
                            <button id="quantityMinus" class="btn btn-outline-light" type="button" aria-label="Decrease quantity">-</button>
                            <input id="productQuantity" class="form-control quantity-input" type="number" min="1" max="99" value="1" aria-label="Quantity">
                            <button id="quantityPlus" class="btn btn-outline-light" type="button" aria-label="Increase quantity">+</button>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <button id="addToCartButton" class="btn btn-accent" type="button"><i class="bi bi-bag me-2"></i>Add to Cart</button>
                            <button id="saveWishlistButton" class="btn btn-outline-light" type="button"><i class="bi bi-heart me-2"></i>Save to My Gear</button>
                        </div>
                        <div id="productFeedback" class="form-feedback" role="status" aria-live="polite"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/shared.js"></script>
    <script src="/product.js"></script>
</body>
</html>
