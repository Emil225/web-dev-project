<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cart | IRON-PREP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav class="navbar sticky-top" data-bs-theme="dark"><div class="container py-2"><a class="navbar-brand" href="/">IRON<span>-PREP</span></a></div></nav>
    <main>
        <section class="section-space">
            <div class="container">
                <p class="eyebrow mb-3">Your gear</p>
                <h1 class="section-heading mb-5">Shopping Cart</h1>
                <div id="cartStatus" role="status" aria-live="polite"></div>
                <div id="cartView" class="row g-4">
                    <div class="col-lg-8">
                        <div id="cartItems" class="d-grid gap-3"></div>
                    </div>
                    <div class="col-lg-4">
                        <aside class="contact-panel p-4" aria-label="Order summary">
                            <h2 class="h4">Order Summary</h2>
                            <div class="d-flex justify-content-between mt-4 mb-2"><span class="muted">Items</span><strong id="summaryCount">0</strong></div>
                            <div class="d-flex justify-content-between border-top border-secondary pt-3 mb-4"><span>Total</span><strong id="summaryTotal">€0.00</strong></div>
                            <div id="checkoutPrompt" class="alert alert-warning d-none" role="alert"></div>
                            <button id="checkoutButton" class="btn btn-accent w-100 py-3" type="button" disabled>Complete Order</button>
                        </aside>
                    </div>
                </div>
                <div id="orderConfirmation" class="contact-panel p-4 p-md-5 d-none" aria-live="polite"></div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/shared.js"></script>
    <script src="/cart.js"></script>
</body>
</html>
