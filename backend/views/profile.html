<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile | IRON-PREP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav class="navbar sticky-top" data-bs-theme="dark"><div class="container py-2"><a class="navbar-brand" href="/">IRON<span>-PREP</span></a></div></nav>
    <main>
        <section class="section-space">
            <div class="container">
                <div id="authGuard"></div>
                <div id="profileDashboard" class="d-none">
                    <div id="raceCountdown" class="race-countdown d-none" aria-live="polite"></div>
                    <section class="mb-5">
                        <p class="eyebrow mb-3">Athlete dashboard</p>
                        <h1 id="profileHeading" class="section-heading">My Profile</h1>
                        <div class="row g-4 mt-1">
                            <div class="col-lg-7">
                                <article class="contact-panel p-4">
                                    <h2 class="h4 mb-4">Account Settings</h2>
                                    <form id="profileForm">
                                        <div class="row g-3">
                                            <div class="col-md-6"><label class="form-label" for="profileName">Name</label><input class="form-control" id="profileName" required></div>
                                            <div class="col-md-6"><label class="form-label" for="profileEmail">Email</label><input class="form-control" id="profileEmail" type="email" required></div>
                                            <div class="col-12"><label class="form-label" for="profileRace">Target Race</label><input class="form-control" id="profileRace" maxlength="120"></div>
                                            <div class="col-md-6"><label class="form-label" for="raceDate">Target Race Date</label><input class="form-control" id="raceDate" type="date"></div>
                                            <div class="col-md-6"><label class="form-label" for="currentPassword">Current Password</label><input class="form-control" id="currentPassword" type="password"></div>
                                            <div class="col-12"><label class="form-label" for="newPassword">New Password</label><input class="form-control" id="newPassword" type="password" minlength="8" placeholder="Leave blank to keep your password"></div>
                                            <div class="col-12"><button class="btn btn-accent" type="submit">Save Profile</button><div id="profileFeedback" class="form-feedback" aria-live="polite"></div></div>
                                        </div>
                                    </form>
                                </article>
                            </div>
                            <div class="col-lg-5">
                                <article class="contact-panel p-4">
                                    <h2 class="h4">Recommended Gear</h2>
                                    <p id="raceGearText" class="muted mb-0">Add a target race date to get a race-day countdown.</p>
                                    <a class="btn btn-outline-light mt-3" href="/checklist">Open Race Checklist</a>
                                </article>
                            </div>
                        </div>
                    </section>

                    <section class="mb-5">
                        <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="section-heading h3 mb-0">My Gear</h2><a class="text-accent" href="/products">Shop gear</a></div>
                        <div id="wishlistStatus" class="muted" role="status" aria-live="polite">Loading My Gear...</div>
                        <div id="wishlistGrid" class="row g-4"></div>
                    </section>

                    <section>
                        <h2 class="section-heading h3 mb-4">Order History</h2>
                        <div id="ordersStatus" class="muted" role="status" aria-live="polite">Loading orders...</div>
                        <div class="accordion" id="ordersAccordion"></div>
                    </section>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/shared.js"></script>
    <script src="/profile.js"></script>
</body>
</html>
